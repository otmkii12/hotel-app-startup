<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

<div class="bg-white shadow rounded p-6 w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-4">Admin Login</h1>

    <label class="block mb-2">Email</label>
    <input type="email" id="email" class="border p-2 w-full mb-4" placeholder="rifkiagung874@gmail.com" autocomplete="username" required>

    <label class="block mb-2">Password</label>
    <input type="password" id="password" class="border p-2 w-full mb-4" placeholder="Password" autocomplete="current-password" required>

    <button onclick="loginAdmin()" class="bg-red-500 text-white px-4 py-2 w-full rounded">Login</button>
    <button type="button" onclick="resetAdminPassword()" class="text-blue-500 text-sm mt-3 w-full">Lupa Password?</button>

    <p id="message" class="text-red-500 mt-4"></p>
    <a href="index.html" class="block text-center mt-4 text-blue-500">Kembali ke Home</a>
</div>

<script>
const email = document.getElementById("email");
const password = document.getElementById("password");
const message = document.getElementById("message");
const ADMIN_EMAILS = ["rifkiagung874@gmail.com"];

auth.languageCode = "id";

function getEmailValue(){
    return email.value.trim().toLowerCase();
}

function isAdminUser(user){
    return user
        && user.emailVerified === true
        && ADMIN_EMAILS.includes(user.email);
}

function loginAdmin(){
    message.innerText = "";
    message.className = "text-red-500 mt-4";

    auth.signInWithEmailAndPassword(getEmailValue(), password.value)
    .then(credential => {
        if(!isAdminUser(credential.user)){
            auth.signOut();
            message.innerText = "Akun admin tidak valid atau email belum diverifikasi.";
            return;
        }

        location.href = "admin.html";
    })
    .catch(error => {
        message.innerText = "Login gagal. Periksa email dan password.";
    });
}

function getResetPasswordErrorMessage(error){
    if(error.code === "auth/user-not-found"){
        return "Akun dengan email ini belum ada di Firebase Authentication.";
    }

    if(error.code === "auth/invalid-email"){
        return "Format email tidak valid.";
    }

    if(error.code === "auth/unauthorized-domain"){
        return "Domain aplikasi belum diizinkan di Firebase Authentication.";
    }

    if(error.code === "auth/too-many-requests"){
        return "Terlalu banyak percobaan. Tunggu beberapa saat lalu coba lagi.";
    }

    return `Gagal mengirim link reset password: ${error.message}`;
}

function resetAdminPassword(){
    const adminEmail = getEmailValue();
    message.className = "text-red-500 mt-4";
    message.innerText = "";

    if(!adminEmail){
        message.innerText = "Masukkan email admin terlebih dahulu.";
        email.focus();
        return;
    }

    if(!ADMIN_EMAILS.includes(adminEmail)){
        message.innerText = "Email ini tidak terdaftar sebagai admin.";
        email.focus();
        return;
    }

    auth.sendPasswordResetEmail(adminEmail)
    .then(() => {
        message.className = "text-green-600 mt-4";
        message.innerText = "Jika akun admin terdaftar, link reset password akan dikirim ke email tersebut. Cek inbox dan spam.";
    })
    .catch(error => {
        message.className = "text-red-500 mt-4";
        message.innerText = getResetPasswordErrorMessage(error);
    });
}
</script>

</body>
</html>
