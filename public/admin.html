<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
</head>

<body class="min-h-screen bg-gray-100 p-3 sm:p-10">

<main class="mx-auto w-full max-w-6xl bg-white p-4 shadow rounded sm:p-6">
    <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <h1 class="text-2xl font-bold">Admin Booking</h1>

        <label class="w-full sm:max-w-xs">
            <span class="sr-only">Cari booking</span>
            <input type="search" id="bookingSearch" class="w-full rounded border p-2" placeholder="Cari nama, email, kode...">
        </label>
    </div>

    <div class="w-full overflow-x-auto rounded border">
        <table class="w-full min-w-[980px] text-sm">
            <thead class="bg-gray-900 text-left text-white">
                <tr>
                    <th class="px-3 py-3 font-semibold">Kode</th>
                    <th class="px-3 py-3 font-semibold">Tamu</th>
                    <th class="px-3 py-3 font-semibold">Kamar</th>
                    <th class="px-3 py-3 font-semibold">Check-in</th>
                    <th class="px-3 py-3 font-semibold">Check-out</th>
                    <th class="px-3 py-3 font-semibold">Status</th>
                    <th class="px-3 py-3 font-semibold">Total</th>
                    <th class="px-3 py-3 font-semibold">Aksi</th>
                </tr>
            </thead>

            <tbody id="adminList"></tbody>
        </table>
    </div>

    <p id="emptySearchMessage" class="hidden py-6 text-center text-sm text-gray-500">Data booking tidak ditemukan.</p>
</main>

<div id="editModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">
    <div class="w-full max-w-2xl rounded bg-white p-5 shadow">
        <div class="mb-4 flex items-center justify-between gap-4">
            <h2 class="text-xl font-bold">Edit Booking</h2>
            <button type="button" id="closeEditModal" class="text-2xl leading-none text-gray-500">&times;</button>
        </div>

        <form id="editForm" class="grid gap-4 sm:grid-cols-2">
            <input type="hidden" id="editId">

            <label class="block">
                <span class="mb-1 block text-sm font-medium">Nama Pemesan</span>
                <input type="text" id="editUserName" class="w-full rounded border p-2" required>
            </label>

            <label class="block">
                <span class="mb-1 block text-sm font-medium">Email</span>
                <input type="email" id="editUserEmail" class="w-full rounded border p-2" required>
            </label>

            <label class="block">
                <span class="mb-1 block text-sm font-medium">Nomor HP</span>
                <input type="text" id="editUserPhone" class="w-full rounded border p-2" required>
            </label>

            <label class="block">
                <span class="mb-1 block text-sm font-medium">Room</span>
                <select id="editRoom" class="w-full rounded border p-2" required>
                    <option value="Deluxe Room">Deluxe Room</option>
                    <option value="Suite Room">Suite Room</option>
                    <option value="Family Room">Family Room</option>
                </select>
            </label>

            <label class="block">
                <span class="mb-1 block text-sm font-medium">Checkin</span>
                <input type="date" id="editCheckin" class="w-full rounded border p-2" required>
            </label>

            <label class="block">
                <span class="mb-1 block text-sm font-medium">Checkout</span>
                <input type="date" id="editCheckout" class="w-full rounded border p-2" required>
            </label>

            <label class="block">
                <span class="mb-1 block text-sm font-medium">Jumlah Tamu</span>
                <input type="number" id="editGuests" class="w-full rounded border p-2" min="1" max="10" required>
            </label>

            <label class="block">
                <span class="mb-1 block text-sm font-medium">Jumlah Kamar</span>
                <input type="number" id="editRooms" class="w-full rounded border p-2" min="1" max="5" required>
            </label>

            <label class="block">
                <span class="mb-1 block text-sm font-medium">Metode Pembayaran</span>
                <select id="editPaymentMethod" class="w-full rounded border p-2" required>
                    <option value="Transfer Bank">Transfer Bank</option>
                    <option value="Virtual Account">Virtual Account</option>
                    <option value="Bayar di Hotel">Bayar di Hotel</option>
                </select>
            </label>

            <label class="block">
                <span class="mb-1 block text-sm font-medium">Status</span>
                <select id="editStatus" class="w-full rounded border p-2" required>
                    <option value="Menunggu Pembayaran">Menunggu Pembayaran</option>
                    <option value="Dikonfirmasi">Dikonfirmasi</option>
                    <option value="Dibatalkan">Dibatalkan</option>
                    <option value="Selesai">Selesai</option>
                </select>
            </label>

            <div class="rounded bg-gray-100 p-3 sm:col-span-2">
                <p class="text-sm">Lama menginap: <strong id="editNightsPreview">-</strong> malam</p>
                <p class="text-sm">Total: <strong id="editTotalPreview">-</strong></p>
            </div>

            <div class="flex justify-end gap-2 sm:col-span-2">
                <button type="button" id="cancelEdit" class="rounded bg-gray-200 px-4 py-2">Batal</button>
                <button type="submit" id="saveEdit" class="rounded bg-blue-600 px-4 py-2 text-white">Simpan</button>
            </div>
        </form>
    </div>
</div>

<script>
auth.onAuthStateChanged(user => {
    if(!user){
        location.href = "index.html";
        return;
    }
    if(!isAdminUser(user)){
        alert("Access denied!");
        auth.signOut();
        location.href = "index.html";
    }
});
</script>

<script src="js/admin.js"></script>

</body>
</html>
