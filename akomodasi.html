<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akomodasi</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<nav class="p-4 bg-white shadow flex items-center justify-between">
    <h1 class="font-bold text-lg">Luxury Hotel</h1>
    <a href="index.html" class="rounded bg-gray-100 px-3 py-2">Home</a>
</nav>

<h2 class="text-2xl text-center mt-6 font-bold sm:text-3xl">Akomodasi</h2>

<div class="grid grid-cols-1 gap-6 p-4 sm:p-6 md:grid-cols-3 md:p-10">

    <div class="bg-white shadow rounded p-4">
        <img src="https://images.unsplash.com/photo-1631049035182-249067d7618e" class="h-56 w-full rounded object-cover">
        <h3 class="mt-3 font-bold">Deluxe Room</h3>
        <p>Rp 800.000</p>
        <button onclick="viewRoom('deluxe')" class="bg-yellow-500 px-3 py-2 mt-2 rounded w-full sm:w-auto">View</button>
    </div>

    <div class="bg-white shadow rounded p-4">
        <img src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2" class="h-56 w-full rounded object-cover">
        <h3 class="mt-3 font-bold">Suite Room</h3>
        <p>Rp 1.500.000</p>
        <button onclick="viewRoom('suite')" class="bg-yellow-500 px-3 py-2 mt-2 rounded w-full sm:w-auto">View</button>
    </div>

    <div class="bg-white shadow rounded p-4">
        <img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32" class="h-56 w-full rounded object-cover">
        <h3 class="mt-3 font-bold">Family Room</h3>
        <p>Rp 1.200.000</p>
        <button onclick="viewRoom('family')" class="bg-yellow-500 px-3 py-2 mt-2 rounded w-full sm:w-auto">View</button>
    </div>

</div>

<script src="js/rooms.js?v=2"></script>
</body>
</html>
