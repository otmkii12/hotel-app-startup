<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Booking</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
</head>

<body class="min-h-screen bg-gray-100 p-3 sm:p-10">

<main class="mx-auto w-full max-w-4xl bg-white p-4 shadow rounded sm:p-6">
    <h2 class="text-2xl font-bold sm:text-3xl">Booking Hotel</h2>

    <p id="room" class="mt-2"></p>

    <div class="grid grid-cols-1 gap-3 mt-4 sm:grid-cols-2">
        <input id="guestName" class="min-w-0 border p-2 w-full rounded" placeholder="Nama pemesan" minlength="2" maxlength="80" autocomplete="name" required>
        <input type="email" id="guestEmail" class="min-w-0 border p-2 w-full rounded" placeholder="Email" maxlength="120" autocomplete="email" required>
        <input type="tel" id="guestPhone" class="min-w-0 border p-2 w-full rounded" placeholder="Nomor HP" minlength="8" maxlength="20" autocomplete="tel" required>
        <select id="paymentMethod" class="min-w-0 border p-2 w-full rounded">
            <option value="">Pilih metode pembayaran</option>
            <option value="Transfer Bank">Transfer Bank</option>
            <option value="Virtual Account">Virtual Account</option>
            <option value="Bayar di Hotel">Bayar di Hotel</option>
        </select>
        <input type="date" id="checkin" class="min-w-0 border p-2 w-full rounded">
        <input type="date" id="checkout" class="min-w-0 border p-2 w-full rounded">
        <input type="number" id="guestCount" min="1" max="10" value="1" class="min-w-0 border p-2 w-full rounded" placeholder="Jumlah tamu">
        <input type="number" id="roomCount" min="1" max="5" value="1" class="min-w-0 border p-2 w-full rounded" placeholder="Jumlah kamar">
        <input id="lama" readonly class="min-w-0 border p-2 w-full rounded" placeholder="Lama menginap">
        <input id="total" readonly class="min-w-0 border p-2 w-full rounded" placeholder="Total harga">
    </div>

    <button onclick="save()" class="bg-green-500 text-white px-4 py-2 mt-4 w-full rounded sm:w-auto">Booking</button>

    <div class="mt-5 w-full overflow-x-auto">
        <table class="w-full min-w-[760px] border text-sm">
            <tbody id="list"></tbody>
        </table>
    </div>
</main>

<script src="js/app.js?v=2"></script>
</body>
</html>
